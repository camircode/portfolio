<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" font-family="'Khand','Arial Narrow',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d7ff4f"/>
    </marker>
    <marker id="tipMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f7a6c"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#0d0f0f"/>
  <rect x="1" y="1" width="1438" height="898" fill="none" stroke="#343934" stroke-width="2"/>

  <!-- header -->
  <text x="80" y="108" fill="#d7ff4f" font-size="26" letter-spacing="4">CADENA DE ENTREGA / DELIVERY CHAIN</text>
  <text x="80" y="166" fill="#f2f1e9" font-size="52" font-weight="600">Un push termina en una respuesta HTTPS pública.</text>
  <text x="80" y="216" fill="#a7ada5" font-size="34">Sin paso manual entre ambos extremos. / No manual step in between.</text>
  <line x1="80" y1="258" x2="1360" y2="258" stroke="#343934" stroke-width="2"/>

  <!-- chain: 5 stages -->
  <g>
    <!-- 1 push -->
    <rect x="80" y="330" width="216" height="188" fill="#171a19" stroke="#343934" stroke-width="2"/>
    <text x="104" y="372" fill="#6f7a6c" font-size="22" letter-spacing="3">01</text>
    <text x="104" y="424" fill="#f2f1e9" font-size="36" font-weight="600">push</text>
    <text x="104" y="462" fill="#a7ada5" font-size="24">repositorio de</text>
    <text x="104" y="490" fill="#a7ada5" font-size="24">aplicación</text>

    <line x1="304" y1="424" x2="352" y2="424" stroke="#d7ff4f" stroke-width="3" marker-end="url(#tip)"/>

    <!-- 2 Jenkins -->
    <rect x="360" y="330" width="216" height="188" fill="#171a19" stroke="#343934" stroke-width="2"/>
    <text x="384" y="372" fill="#6f7a6c" font-size="22" letter-spacing="3">02</text>
    <text x="384" y="424" fill="#f2f1e9" font-size="36" font-weight="600">Jenkins</text>
    <text x="384" y="462" fill="#a7ada5" font-size="24">pruebas y</text>
    <text x="384" y="490" fill="#a7ada5" font-size="24">construcción</text>

    <line x1="584" y1="424" x2="632" y2="424" stroke="#d7ff4f" stroke-width="3" marker-end="url(#tip)"/>

    <!-- 3 GHCR -->
    <rect x="640" y="330" width="216" height="188" fill="#171a19" stroke="#343934" stroke-width="2"/>
    <text x="664" y="372" fill="#6f7a6c" font-size="22" letter-spacing="3">03</text>
    <text x="664" y="424" fill="#f2f1e9" font-size="36" font-weight="600">GHCR</text>
    <text x="664" y="462" fill="#a7ada5" font-size="24">imagen por</text>
    <text x="664" y="490" fill="#a7ada5" font-size="24">digest sha256</text>

    <line x1="864" y1="424" x2="912" y2="424" stroke="#d7ff4f" stroke-width="3" marker-end="url(#tip)"/>

    <!-- 4 gitops -->
    <rect x="920" y="330" width="216" height="188" fill="#171a19" stroke="#343934" stroke-width="2"/>
    <text x="944" y="372" fill="#6f7a6c" font-size="22" letter-spacing="3">04</text>
    <text x="944" y="424" fill="#f2f1e9" font-size="36" font-weight="600">gitops</text>
    <text x="944" y="462" fill="#a7ada5" font-size="24">commit al estado</text>
    <text x="944" y="490" fill="#a7ada5" font-size="24">deseado</text>

    <line x1="1144" y1="424" x2="1192" y2="424" stroke="#d7ff4f" stroke-width="3" marker-end="url(#tip)"/>

    <!-- 5 Argo CD -->
    <rect x="1200" y="330" width="160" height="188" fill="#d7ff4f" stroke="#d7ff4f" stroke-width="2"/>
    <text x="1224" y="372" fill="#5c6630" font-size="22" letter-spacing="3">05</text>
    <text x="1224" y="424" fill="#101306" font-size="36" font-weight="600">Argo CD</text>
    <text x="1224" y="462" fill="#3b4226" font-size="24">sincroniza el</text>
    <text x="1224" y="490" fill="#3b4226" font-size="24">clúster</text>
  </g>

  <!-- outcome -->
  <line x1="1280" y1="530" x2="1280" y2="596" stroke="#d7ff4f" stroke-width="3" marker-end="url(#tip)"/>
  <text x="1360" y="642" fill="#f2f1e9" font-size="34" font-weight="600" text-anchor="end">https://&lt;app&gt;.camir.tech</text>

  <!-- substrate -->
  <line x1="80" y1="712" x2="1360" y2="712" stroke="#343934" stroke-width="2"/>
  <text x="80" y="762" fill="#6f7a6c" font-size="22" letter-spacing="3">SUSTRATO / SUBSTRATE</text>
  <text x="80" y="812" fill="#a7ada5" font-size="30">OVHcloud bare metal → Proxmox → Kubernetes</text>
  <text x="80" y="854" fill="#a7ada5" font-size="30">Terraform aprovisiona · Ansible configura · Bitwarden Secrets Manager guarda · WireGuard es la única entrada</text>

  <text x="1360" y="772" fill="#6f7a6c" font-size="26" text-anchor="end">Prometheus · Loki · Grafana</text>
</svg>
